apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  labels:
    app: oom-demo

spec:
  containers:
  - name: oom-demo
    image: polinux/stress
    resources:
      limits:
        memory: "100Mi"
      requests:
        memory: "50Mi"
    command: ["stress"]
    args: ["--vm","1", "--vm-bytes","200M","--vm-hang","1"]
  restartPolicy: Never

